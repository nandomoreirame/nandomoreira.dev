<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" font-family="Alegreya Sans, system-ui, sans-serif">
  <title>A esteira: três fases, um dono e um prazo para cada</title>
  <rect width="640" height="690" fill="#191714"/>

  <text x="40" y="52" fill="#a29e96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" letter-spacing="2">A ESTEIRA NO CARD</text>
  <text x="40" y="84" fill="#efebe2" font-family="Literata, Georgia, serif" font-size="26" font-weight="600">Três fases, um prazo para cada</text>

  <!-- Phases: 64 high, 80 apart, from y=116; the owner on the right -->
  <g font-size="20">
    <g fill="#211f1c" stroke="#6c6863">
      <rect x="40" y="116" width="560" height="64" rx="8"/>
      <rect x="40" y="196" width="560" height="64" rx="8"/>
      <rect x="40" y="276" width="560" height="64" rx="8"/>
      <rect x="40" y="356" width="560" height="64" rx="8" stroke-dasharray="5 4"/>
    </g>
    <g fill="#f0c36f" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">
      <text x="64" y="154">1</text>
      <text x="64" y="234">2</text>
      <text x="64" y="314">3</text>
      <text x="64" y="394" fill="#a29e96">✓</text>
    </g>
    <g fill="#efebe2">
      <text x="92" y="155">Preparar a base</text>
      <text x="92" y="235">Gerar indicadores e relatório</text>
      <text x="92" y="315">Entregar o relatório</text>
      <text x="92" y="395" fill="#a29e96">Concluída</text>
    </g>
    <g fill="#a29e96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" text-anchor="end">
      <text x="576" y="154">time de dados</text>
      <text x="576" y="234">analistas</text>
      <text x="576" y="314">analistas</text>
    </g>
  </g>

  <text x="40" y="462" fill="#a29e96" font-size="17">O responsável troca sozinho quando a base muda de fase.</text>

  <!-- Deadline states -->
  <text x="40" y="508" fill="#efebe2" font-size="19">Cada fase tem um orçamento de tempo,</text>
  <text x="40" y="532" fill="#efebe2" font-size="19">e o card diz onde a base está:</text>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">
    <rect x="40" y="552" width="140" height="40" rx="20" fill="none" stroke="#a9ddb2"/>
    <text x="110" y="578" fill="#a9ddb2" text-anchor="middle">no prazo</text>
    <rect x="196" y="552" width="140" height="40" rx="20" fill="none" stroke="#facf9e"/>
    <text x="266" y="578" fill="#facf9e" text-anchor="middle">em risco</text>
    <rect x="352" y="552" width="140" height="40" rx="20" fill="none" stroke="#ffb7b0"/>
    <text x="422" y="578" fill="#ffb7b0" text-anchor="middle">atrasada</text>
  </g>
  <text x="40" y="636" fill="#a29e96" font-size="17">"Em risco" é o que importa: a gestão vê o atraso chegando</text>
  <text x="40" y="660" fill="#a29e96" font-size="17">enquanto ainda dá para agir.</text>
</svg>
