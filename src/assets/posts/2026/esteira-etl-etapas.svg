<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" font-family="Alegreya Sans, system-ui, sans-serif">
  <title>A esteira: oito etapas, um dono por etapa e um prazo por etapa</title>
  <rect width="640" height="960" fill="#191714"/>

  <text x="40" y="52" fill="#a29e96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" letter-spacing="2">A ESTEIRA NO CARD</text>
  <text x="40" y="84" fill="#efebe2" font-family="Literata, Georgia, serif" font-size="26" font-weight="600">Oito etapas, um prazo para cada</text>

  <!-- Stage rows: 52 high, 64 apart, from y=116 -->
  <g font-size="19">
    <g fill="#211f1c" stroke="#6c6863">
      <rect x="130" y="116" width="370" height="52" rx="8"/>
      <rect x="130" y="180" width="370" height="52" rx="8"/>
      <rect x="130" y="244" width="370" height="52" rx="8"/>
      <rect x="130" y="308" width="370" height="52" rx="8"/>
      <rect x="130" y="372" width="370" height="52" rx="8"/>
      <rect x="130" y="436" width="370" height="52" rx="8"/>
      <rect x="130" y="500" width="370" height="52" rx="8"/>
      <rect x="130" y="564" width="370" height="52" rx="8"/>
      <rect x="130" y="628" width="370" height="52" rx="8" stroke-dasharray="5 4"/>
    </g>
    <g fill="#f0c36f" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">
      <text x="150" y="148">1</text>
      <text x="150" y="212">2</text>
      <text x="150" y="276">3</text>
      <text x="150" y="340">4</text>
      <text x="150" y="404">5</text>
      <text x="150" y="468">6</text>
      <text x="150" y="532">7</text>
      <text x="150" y="596">8</text>
      <text x="150" y="660" fill="#a29e96">✓</text>
    </g>
    <g fill="#efebe2">
      <text x="178" y="149">Receber a base</text>
      <text x="178" y="213">Pré-normalizar</text>
      <text x="178" y="277">Sincronizar os dados</text>
      <text x="178" y="341">Gerar os indicadores</text>
      <text x="178" y="405">Gerar a base</text>
      <text x="178" y="469">Gerar o relatório</text>
      <text x="178" y="533">Gerar os insights <tspan fill="#a29e96" font-size="15">· editor com IA</tspan></text>
      <text x="178" y="597">Enviar o relatório</text>
      <text x="178" y="661" fill="#a29e96">Concluída</text>
    </g>
  </g>

  <!-- Who owns what (left) -->
  <g stroke="#f0c36f" stroke-width="2" fill="none">
    <path d="M112 120 H100 V292 H112"/>
    <path d="M112 312 H100 V612 H112"/>
  </g>
  <g fill="#efebe2" font-size="17" text-anchor="middle">
    <text x="84" y="206" transform="rotate(-90 84 206)">ETL</text>
    <text x="84" y="462" transform="rotate(-90 84 462)">Analistas</text>
  </g>

  <!-- What runs by itself (right) -->
  <path d="M518 120 H530 V356 H518" stroke="#a9ddb2" stroke-width="2" fill="none"/>
  <text x="552" y="238" fill="#a9ddb2" font-size="17" text-anchor="middle" transform="rotate(90 552 238)">disparadas do card</text>

  <text x="40" y="722" fill="#a29e96" font-size="17">O responsável troca sozinho quando a base muda de etapa.</text>

  <!-- Deadline states -->
  <text x="40" y="768" fill="#efebe2" font-size="19">Cada etapa tem um orçamento de tempo,</text>
  <text x="40" y="792" fill="#efebe2" font-size="19">e o card diz onde a base está:</text>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">
    <rect x="40" y="812" width="140" height="40" rx="20" fill="none" stroke="#a9ddb2"/>
    <text x="110" y="838" fill="#a9ddb2" text-anchor="middle">no prazo</text>
    <rect x="196" y="812" width="140" height="40" rx="20" fill="none" stroke="#facf9e"/>
    <text x="266" y="838" fill="#facf9e" text-anchor="middle">em risco</text>
    <rect x="352" y="812" width="140" height="40" rx="20" fill="none" stroke="#ffb7b0"/>
    <text x="422" y="838" fill="#ffb7b0" text-anchor="middle">atrasada</text>
  </g>
  <text x="40" y="896" fill="#a29e96" font-size="17">"Em risco" é o que importa: a gestão vê o atraso chegando</text>
  <text x="40" y="920" fill="#a29e96" font-size="17">enquanto ainda dá para agir.</text>
</svg>
