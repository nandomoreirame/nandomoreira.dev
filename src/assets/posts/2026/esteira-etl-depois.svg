<svg xmlns="http://www.w3.org/2000/svg" width="640" height="810" viewBox="0 0 640 810" font-family="Alegreya Sans, system-ui, sans-serif">
  <title>Depois: tudo parte do card da base</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a29e96"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a9ddb2"/>
    </marker>
  </defs>

  <rect width="640" height="810" fill="#191714"/>

  <text x="40" y="52" fill="#a29e96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" letter-spacing="2">DEPOIS</text>
  <text x="40" y="84" fill="#efebe2" font-family="Literata, Georgia, serif" font-size="26" font-weight="600">Tudo parte do card da base</text>

  <!-- One idea per box, top to bottom -->
  <g font-size="21">
    <rect x="40" y="116" width="480" height="76" rx="10" fill="#211f1c" stroke="#6c6863"/>
    <text x="64" y="148" fill="#efebe2">Entrada de dados</text>
    <text x="64" y="174" fill="#a29e96" font-size="17">em vários formatos, de cada cliente</text>

    <rect x="40" y="232" width="480" height="76" rx="10" fill="#211f1c" stroke="#f0c36f" stroke-width="2"/>
    <text x="64" y="264" fill="#f0c36f" font-family="Literata, Georgia, serif" font-weight="600">Play Manager</text>
    <text x="64" y="290" fill="#a29e96" font-size="17">o card de cada base: fase, responsável e prazo</text>

    <rect x="40" y="348" width="480" height="76" rx="10" fill="#211f1c" stroke="#facf9e"/>
    <text x="64" y="380" fill="#efebe2">Filas</text>
    <text x="64" y="406" fill="#a29e96" font-size="17">cada etapa concluída puxa a próxima sozinha</text>

    <rect x="40" y="464" width="480" height="140" rx="10" fill="#211f1c" stroke="#6c6863"/>
    <text x="64" y="496" fill="#efebe2">Engine de preparação dos dados</text>
    <text x="64" y="526" fill="#a29e96" font-size="17">· regra fixa no que é previsível</text>
    <text x="64" y="554" fill="#a29e96" font-size="17">· IA só no que é ambíguo</text>
    <text x="64" y="582" fill="#a9ddb2" font-size="17">· mais de 4.800 testes automáticos</text>

    <rect x="40" y="644" width="480" height="76" rx="10" fill="#211f1c" stroke="#a9ddb2"/>
    <text x="64" y="676" fill="#efebe2">Indicadores prontos</text>
    <text x="64" y="702" fill="#a29e96" font-size="17">a mesma pipeline de antes, sem ninguém empurrar</text>
  </g>

  <g stroke="#a29e96" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M200 192 V228"/>
    <path d="M200 308 V344"/>
    <path d="M200 424 V460"/>
    <path d="M200 604 V640"/>
  </g>

  <!-- Feedback: the card moves on by itself -->
  <path d="M520 682 H580 V270 H524" stroke="#a9ddb2" stroke-width="2" fill="none" marker-end="url(#arrow-ok)"/>
  <text x="604" y="476" fill="#a9ddb2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" transform="rotate(-90 604 476)" text-anchor="middle">o card avança sozinho</text>

  <text x="40" y="776" fill="#f0c36f" font-family="Literata, Georgia, serif" font-size="22" font-weight="600">até 30 minutos</text>
</svg>
