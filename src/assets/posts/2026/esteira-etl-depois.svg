<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1210" viewBox="0 0 640 1210" font-family="Alegreya Sans, system-ui, sans-serif">
  <title>Depois: tudo parte do card da base</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a29e96"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a9ddb2"/>
    </marker>
  </defs>

  <rect width="640" height="1210" fill="#191714"/>

  <text x="40" y="52" fill="#a29e96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" letter-spacing="2">DEPOIS</text>
  <text x="40" y="84" fill="#efebe2" font-family="Literata, Georgia, serif" font-size="26" font-weight="600">Tudo parte do card da base</text>

  <!-- Play Manager -->
  <rect x="40" y="116" width="560" height="112" rx="10" fill="#211f1c" stroke="#f0c36f" stroke-width="2"/>
  <text x="64" y="152" fill="#f0c36f" font-family="Literata, Georgia, serif" font-size="24" font-weight="600">Play Manager</text>
  <text x="64" y="182" fill="#efebe2" font-size="18">fonte da verdade: fase, responsável, prazo e saúde</text>
  <text x="64" y="208" fill="#a29e96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">React 19 · Hono · Firebase</text>

  <g stroke="#a29e96" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M200 228 V288"/>
    <path d="M200 388 V424"/>
    <path d="M200 848 V884"/>
    <path d="M200 952 V988"/>
  </g>
  <g fill="#a29e96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">
    <text x="216" y="254">botão no card ou</text>
    <text x="216" y="274">encadeamento automático</text>
    <text x="216" y="872">envio sem o gatilho</text>
  </g>

  <!-- Queues -->
  <g font-family="JetBrains Mono, ui-monospace, monospace">
    <rect x="40" y="292" width="560" height="44" rx="22" fill="#211f1c" stroke="#facf9e"/>
    <text x="64" y="319" fill="#facf9e" font-size="15">FILA DE EXTRAÇÃO <tspan fill="#a29e96">· uma por fonte</tspan></text>

    <rect x="40" y="344" width="560" height="44" rx="22" fill="#211f1c" stroke="#facf9e"/>
    <text x="64" y="371" fill="#facf9e" font-size="15">FILA DE PRÉ-NORMALIZAÇÃO <tspan fill="#a29e96">· duas por vez</tspan></text>

    <rect x="40" y="888" width="560" height="64" rx="22" fill="#211f1c" stroke="#facf9e"/>
    <text x="64" y="915" fill="#facf9e" font-size="15">FILA DE GATILHO <tspan fill="#a29e96">· uma base por vez</tspan></text>
    <text x="64" y="938" fill="#a29e96" font-size="13">só sai sem job em voo · idempotente por base e mês</text>
  </g>

  <!-- Engine, hexagonal: adapters at the edges, the domain in the middle -->
  <rect x="40" y="428" width="560" height="420" rx="10" fill="#211f1c" stroke="#6c6863"/>
  <text x="64" y="462" fill="#efebe2" font-family="Literata, Georgia, serif" font-size="22" font-weight="600">Engine de pré-normalização</text>
  <text x="64" y="488" fill="#a29e96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">Python · FastAPI · Polars · Cloud Run</text>

  <g stroke="#6c6863" stroke-width="1.5">
    <path d="M244 534 L276 595"/>
    <path d="M244 598 L262 615"/>
    <path d="M244 662 L262 645"/>
    <path d="M244 726 L276 665"/>
    <path d="M396 580 L378 608"/>
    <path d="M396 680 L378 652"/>
  </g>
  <polygon points="384,630 352,685 288,685 256,630 288,575 352,575" fill="#191714" stroke="#f0c36f" stroke-width="2"/>
  <text x="320" y="626" fill="#efebe2" font-size="18" text-anchor="middle">Domínio</text>
  <text x="320" y="648" fill="#a29e96" font-size="15" text-anchor="middle">estável</text>

  <g font-size="17">
    <rect x="52" y="506" width="192" height="56" rx="8" fill="#191714" stroke="#f0c36f"/>
    <text x="68" y="528" fill="#efebe2">Arquivo</text>
    <text x="68" y="550" fill="#a29e96" font-size="15">xlsx ou txt, pelo card</text>

    <rect x="52" y="570" width="192" height="56" rx="8" fill="#191714" stroke="#6c6863"/>
    <text x="68" y="592" fill="#efebe2">Fonte A</text>
    <text x="68" y="614" fill="#a29e96" font-size="15">dispara e lê depois</text>

    <rect x="52" y="634" width="192" height="56" rx="8" fill="#191714" stroke="#6c6863"/>
    <text x="68" y="656" fill="#efebe2">Fonte B</text>
    <text x="68" y="678" fill="#a29e96" font-size="15">execução assíncrona</text>

    <rect x="52" y="698" width="192" height="56" rx="8" fill="#191714" stroke="#6c6863"/>
    <text x="68" y="720" fill="#efebe2">Fonte C</text>
    <text x="68" y="742" fill="#a29e96" font-size="15">API REST paginada</text>

    <rect x="396" y="548" width="192" height="64" rx="8" fill="#191714" stroke="#6c6863"/>
    <text x="412" y="574" fill="#efebe2">IA</text>
    <text x="412" y="598" fill="#a29e96" font-size="15">só no que é ambíguo</text>

    <rect x="396" y="648" width="192" height="64" rx="8" fill="#191714" stroke="#6c6863"/>
    <text x="412" y="674" fill="#efebe2">Saída</text>
    <text x="412" y="698" fill="#a29e96" font-size="15">contrato da pipeline</text>
  </g>

  <text x="320" y="776" fill="#a29e96" font-size="16" text-anchor="middle">cliente novo = adaptador novo; o domínio não muda</text>
  <rect x="56" y="796" width="528" height="36" rx="8" fill="#191714" stroke="#a9ddb2"/>
  <text x="320" y="819" fill="#a9ddb2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" text-anchor="middle">4.800+ testes · unitário, integração, regressão, paridade</text>

  <!-- Indicators pipeline -->
  <rect x="40" y="992" width="480" height="76" rx="10" fill="#211f1c" stroke="#a9ddb2"/>
  <text x="64" y="1024" fill="#efebe2" font-size="21">Pipeline de indicadores</text>
  <text x="64" y="1050" fill="#a29e96" font-size="17">na nuvem, a mesma de antes</text>

  <!-- Feedback: every step done moves the card and queues the next -->
  <path d="M520 1030 H616 V172 H604" stroke="#a9ddb2" stroke-width="2" fill="none" marker-end="url(#arrow-ok)"/>
  <text x="632" y="620" fill="#a9ddb2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" transform="rotate(-90 632 620)" text-anchor="middle">cada passo concluído avança o card e enfileira o próximo</text>

  <text x="40" y="1112" fill="#a29e96" font-size="17">Validação reprovada e volumetria divergente</text>
  <text x="40" y="1136" fill="#a29e96" font-size="17">viram alerta no card, não trava a esteira.</text>
  <text x="40" y="1180" fill="#f0c36f" font-family="Literata, Georgia, serif" font-size="22" font-weight="600">até 30 minutos</text>
</svg>
