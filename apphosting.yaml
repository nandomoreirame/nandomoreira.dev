runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: HOST
    value: "0.0.0.0"
    availability:
      - RUNTIME

  # /api/hire. Values live in Secret Manager, never in the repository, and the
  # route reads them at boot so a missing one fails loudly instead of degrading
  # to "never notifies" (REQ-010).
  - variable: RESEND_API_KEY
    secret: hire-resend-api-key
    availability:
      - RUNTIME

  - variable: HIRE_NOTIFY_TO
    secret: hire-notify-to
    availability:
      - RUNTIME

  - variable: HIRE_NOTIFY_FROM
    secret: hire-notify-from
    availability:
      - RUNTIME

  # /now. A missing secret degrades that section; it does not stop boot (REQ-017).
  - variable: SPOTIFY_CLIENT_ID
    secret: now-spotify-client-id
    availability:
      - RUNTIME

  - variable: SPOTIFY_CLIENT_SECRET
    secret: now-spotify-client-secret
    availability:
      - RUNTIME

  - variable: SPOTIFY_REFRESH_TOKEN
    secret: now-spotify-refresh-token
    availability:
      - RUNTIME

  - variable: OPENXBL_API_KEY
    secret: now-openxbl-api-key
    availability:
      - RUNTIME

  - variable: GITHUB_TOKEN
    secret: now-github-token
    availability:
      - RUNTIME

scripts:
  buildCommand: npm run build
  runCommand: node ./dist/server/entry.mjs
